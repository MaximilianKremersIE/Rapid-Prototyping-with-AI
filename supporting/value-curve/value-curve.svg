<title id="t">Strategy canvas: student housing in Madrid</title>
<desc id="d">Offering level 0 to 5 on nine factors for Idealista, Spotahome and HousingAnywhere (scored from sources dated 2026-10-12) and our platform (hypothetical target, dashed). Gaps are unknown scores, not zero. Agent comparison unavailable: evidence missing. Full table in README.md.</desc>
